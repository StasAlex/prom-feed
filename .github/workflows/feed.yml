name: Update Prom feed
on:
  schedule:
    # раз в сутки, 05:00 UTC (08:00 Киев) — состав каталога стабильный,
    # обновляются только наличие и цены
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      refresh_new:
        description: 'Забрать новинки поставщика на свободные слоты (обычно только 1-го числа)'
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build feed
        env:
          REFRESH_NEW: ${{ inputs.refresh_new && '1' || '0' }}
        run: python build_prom_feed.py download docs/prom_feed.xml
      - name: Commit
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add docs/prom_feed.xml docs/feed_state.json
          git commit -m "update feed $(date -u +%FT%TZ)" || echo "no changes"
          git push
